# balboa: real warehouse bugs located at the commit that introduced them, part of the fresh9 held-out set.
# Written by hand from the public upstream history (https://github.com/datacoves/balboa): each bug was found from a later fix commit,
# the fixed lines were traced with git blame on the fix's parent, and the introducing commit was read to confirm it
# added the faulty lines. Never derived from any reviewer's output.
repo: balboa
url: https://github.com/datacoves/balboa
bugs:
- commit: "525eba96fc"
  parent: "9c6fc30ada"
  title: update schedule
  fix: "97f1b80892"
  fix_title: fixed obvious typo in airbyte_raw_country_populations
  bug: the airbyte_raw_country_populations source model has a misspelled keyword (SEEL instead of select) in its final CTE, so the SQL is invalid and the model fails
  category: other
  in_scope: true
  compiles: false
  needs_data: false
  must_mention: [SEEL, final]
  expect:
  - {path: transform/models/sources/country_data/_airbyte_raw_country_populations.sql, line: 12}
- commit: "3d2222b064"
  parent: "b819fb17d1"
  title: add regranting of inherited grants after clone, inactivate task in snowcap, and remove post-hook from dbt, update dbt package versions
  fix: "11dec8c79a"
  fix_title: fix macro for inherited grants
  bug: grant_db_usage issues grant select on inherited tables in database, which is not valid Snowflake SQL (the inherited keyword belongs before the privilege and needs all), so the grants fail
  category: other
  in_scope: true
  compiles: false
  needs_data: false
  must_mention: [inherited, grant]
  expect:
  - {path: transform/macros/tooling/blue-green/grant_db_usage.sql, line: 38}
