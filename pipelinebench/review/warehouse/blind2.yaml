# Blind set 2: real warehouse bugs from two more public SQL warehouses, located at the commit that introduced them.
# Hold these back like blind.yaml: do not use them to tune ChangeLens; score them only when a version is frozen.
# Written by hand from public upstream history by a labeller who did not read or run ChangeLens. Each bug was found
# from a later fix commit, the fixed lines were traced with git blame on the fix's parent, and the introducing commit
# and its message were read to confirm it added the faulty lines. Never derived from ChangeLens's output.
# Fields as in dev.yaml: commit and parent are the introducing commit and its parent; fix is the later repair;
# expect gives lines in the introducing commit's own version of each file (each span was printed back from
# `git show <commit>:<path>` before it was written here); category is from the closed list in README.md; in_scope is
# true when lineage, schema or row-count reasoning can see the bug from the diff.
#
# README2 (notes for this file)
#
# Repositories (both cloned in full, anonymously, into a scratch folder outside every other repository):
#   - duneanalytics/spellbook (https://github.com/duneanalytics/spellbook): Dune's community dbt project on Trino.
#     7,522 commits, 8,132 SQL files at HEAD, 623 MB clone. 13 bugs.
#   - opensource-observer/opensource-observer (https://github.com/opensource-observer/opensource-observer): the
#     archived Open Source Observer data pipeline, dbt (warehouse/dbt, BigQuery) and later SQLMesh
#     (warehouse/oso_sqlmesh and warehouse/metrics_mesh, Trino). 4,657 commits, 523 SQL files at HEAD (about 400 of
#     them warehouse models), 286 MB clone. 12 bugs. Note: SQLMesh models are plain SQL with a MODEL() header in
#     place of dbt config and YAML; grain() and audits() play the role of dbt tests.
#   Tried and not used: opensource-observer/oso now holds 4 commits (history moved to the repo above);
#   dagster-io/dagster-open-platform has 961 commits but only 67 SQL files; FlipsideCrypto/ethereum-models asks for a
#   sign-in (private or gone).
#
# Method: exactly as README.md. Fix candidates: message matches fix, revert, hotfix, wrong, duplicate, fanout, null,
# filter, missing, incorrect or dedup; at most six SQL or YAML files under a models/ path; at most 300 changed lines
# (603 spellbook and 196 OSO candidates). git blame on the fix's parent over every removed or replaced line; kept
# candidates whose main introducing commit changed under 400 lines (324 and 137). About 90 were then read by hand.
#
# Rejected after reading (examples, not exhaustive):
#   - cause in a different commit from the one blame named: spellbook ac922815d8 (labels_eth_stakers reads `address`;
#     the column was renamed upstream in 5c21d4d0a, 1,225 lines), 81d61121eb (worldcoin reads creation_tx_hash;
#     renamed upstream in 73ba7276d, 5,231 lines), 3c5ab7550e (block_month line added later), 13b52581fd (1inch
#     second_side flag added later); OSO 4cf307d7ef (the inner join existed before the blamed rewrite).
#   - introducer over 400 lines: spellbook ec3d7be04 "[CoW] Migrate Trades Table" drops block_number, which the
#     schema still documents (fixed by b590acc4cc); a clean documented_column_not_selected, but 705 lines (460 of them
#     verbatim _legacy copies), so rejected by the rule. Spellbook 081b6595df "Reapply solana transfers" (stray comma
#     and an unresolved call_block_slot; fixes 0e511dd0dd, 0157ea277d) is 412 lines, also rejected.
#   - faulty line moved, not written, by the blamed commit: spellbook 50deff1fe8 (paraswap call_success filter missing
#     before too), 0d51502cbe (airswap `tx.block_time =` filter existed before 7f9936360b).
#   - cause not visible in the diff: duplicates in raw sources (spellbook a5864f6119, ecba180f67, 3e6b431dc8,
#     014adca1c7, 5726ec3583, 49d15619c3); intent unclear or a naming choice (OSO c575e85026 models_v0 column names,
#     c74cf94eab key_metrics metric column, fac8c284c4 grant metrics filter, spellbook e801a5fee2 date bound added on
#     purpose); fix mostly reorders logic (spellbook 11f1d347ec pumpswap).
#   - performance or dialect only: spellbook b0bb51e33d (null skew), 30c019fa8d, f012ac30d4 (Spark casts in string
#     concatenation); OSO 721bbed027's regex escaping half (only its join half is labelled).
#   - near-duplicate of a kept pattern, left out for variety: OSO a1b0129e85 (bigint SUM overflow in
#     int_events_daily__blockchain, same class as afcf49844c). It is valid and can be added as a spare.
#
# Counts by category (25 bugs, 23 in scope):
#   row_count_change 11 | nullability_or_cast 5 | schema_contract 3 | other 3 | business_logic 2 (out of scope)
#   dropped_or_renamed_column_with_readers 1 | documented_column_not_selected 0
#   By repo: spellbook 13 (11 in scope), opensource-observer 12 (12 in scope).
#
# Honest limits:
#   - No documented_column_not_selected bug survived the method. The one clean case (CoW block_number) failed the
#     400-line rule. A scripted search for small fixes that add back a column the parent YAML documents found only
#     feature additions or upstream renames.
#   - Shared commits: spellbook 8d4db5edf8 introduces two bugs (Blur currency addresses, Fantasy chain argument) and
#     OSO a1c7ea770f introduces two (integer division, bigint overflow); each is fixed by its own commit.
#   - Spellbook d8631db9d7 is itself a fix commit that introduced the 7-day CI filters it says to revert.
#   - OSO b3e8522d8d: the fix (a8b7dcf1f3) only adds SELECT DISTINCT; the label names the join that lets a repo match
#     the repo_stats row of every project that owns it. The fix shows duplicates; that the join is their only source
#     is the labeller's reading.
#   - Spellbook 92ac3cf0cd: the 2025-only bounds the same fix removed were intended by the author (the PR says 2025
#     only), so only the token_id grouping is labelled.
#   - Several nullability_or_cast bugs depend on the engine (Trino integer division, BIGINT and INTEGER overflow,
#     DECIMAL(38,0) range); the types are visible in the SQL but a reviewer has to know Trino's rules.
#   - Line spans for whole statements give the line a reviewer should point at, not every line involved.
