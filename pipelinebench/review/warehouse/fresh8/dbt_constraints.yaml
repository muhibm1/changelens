    parent: "7bf9091826"
    title: "Minor typo for 'true' instead of true"
    fix: "9ef95da7dc"
    fix_title: "Logic was reversed. We want where null? is 'false'"
    bug: "the column loop appends a column to not_null_col when row['null?'] == 'true', that is when the column is nullable, so the reversed test reports nullable columns as not null"
    category: business_logic
    in_scope: true
    compiles: true
    needs_data: false
    must_mention: ["null?", "not_null_col"]
    expect:
      - {path: "macros/snowflake__create_constraints.sql", line: 382}
