# dbt_constraints: real warehouse bugs located at the commit that introduced them, part of the fresh8 held-out set.
# Written by hand from the public upstream history (https://github.com/Snowflake-Labs/dbt_constraints): each bug was found from a later fix commit,
# the fixed lines were traced with git blame on the fix's parent, and the introducing commit was read to confirm it
# added the faulty lines. Never derived from ChangeLens's output.
repo: dbt_constraints
url: https://github.com/Snowflake-Labs/dbt_constraints
bugs:
