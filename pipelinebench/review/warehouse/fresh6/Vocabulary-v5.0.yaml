    bug: "the new recursive CTE code_parents in ICD10PCS load_stage.sql selects concept_code (varchar(50)) as parent_code in the non-recursive term and LEFT(parent_code, ...) (text) in the recursive term; PostgreSQL requires the column types of a recursive UNION ALL to match, so building temp_parent_codes fails"
