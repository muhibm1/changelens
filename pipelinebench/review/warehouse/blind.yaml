# Blind set: real warehouse bugs from two public dbt projects, located at the commit that introduced them.
# Hold these back: do not use them to tune ChangeLens; score them only when a version is frozen.
# Written by hand from the public upstream history: each bug was found from a later fix commit, the fixed lines
# were traced with git blame on the fix's parent, and the introducing commit was read to confirm it added the
# faulty lines. Never derived from ChangeLens's output.
# Fields as in dev.yaml: commit and parent are the introducing commit and its parent; fix is the later repair;
# expect gives lines in the introducing commit's version of each file; category is from the closed list in
# README.md; in_scope is true when lineage, schema or row-count reasoning can see the bug from the diff.
repos:
  - repo: tuva
    url: https://github.com/tuva-health/tuva
    bugs:
      - commit: b0c7722a66
        parent: d58eec0d24
        title: "added filter for encounter fields; removed a redundant ed_classification model"
        fix: 18e39fa284
        fix_title: "Fixed ED Classification Duplicates Bug (#333)"
        bug: "the summary left joins ccsr__long_condition_category on encounter and diagnosis code, which holds several CCSR categories per code, so encounters are duplicated"
        category: row_count_change
        in_scope: true
        must_mention: [ccsr__long_condition_category, duplicate, encounter_id]
        expect:
          - {path: models/ed_classification/final/ed_classification__summary.sql, line: 18, end_line: 19}
          - {path: models/ed_classification/final/ed_classification__summary.sql, line: 43, end_line: 45}
      - commit: ffa41cdba1
        parent: 0ff25ef6a4
        title: "changing npi column to id; adding description/names to code columns"
        fix: 3a6dff465a
        fix_title: "bug fix for multiple org names in one encounter (#524)"
        bug: "the facility CTE joins terminology__provider and groups by encounter and provider_organization_name, so an encounter with facility ids under different organization names yields one row per name and fans out the summary"
        category: row_count_change
        in_scope: true
        must_mention: [provider_organization_name, group by, encounter_id]
        expect:
          - {path: models/claims_preprocessing/acute_inpatient/final/acute_inpatient__summary.sql, line: 82, end_line: 87}
          - {path: models/claims_preprocessing/emergency_department/final/emergency_department__summary.sql, line: 83, end_line: 88}
      - commit: ffa41cdba1
        parent: 0ff25ef6a4
        title: "changing npi column to id; adding description/names to code columns"
        fix: 9cefd85937
        fix_title: "Fixing ref in emergency_department__summary.sql to reference staging table rather than input_layer."
        bug: "the emergency department summary reads ref('eligibility') from the input layer instead of its own emergency_department__stg_eligibility staging model, bypassing the staging layer in the lineage"
        category: other
        in_scope: true
        must_mention: [eligibility, emergency_department__stg_eligibility, input layer]
        expect: [{path: models/claims_preprocessing/emergency_department/final/emergency_department__summary.sql, line: 76}]
      - commit: 118e818ac8
        parent: ab91d8b389
        title: "Pmpm updates (#284)"
        fix: 593d40710d
        fix_title: "Fixing PMPM prep join issue (#568)"
        bug: "member months now carry data_source, but the four service-category pivots are joined on patient, month, payer and plan only, so a member present in two data sources fans out"
        category: row_count_change
        in_scope: true
        must_mention: [data_source, join, fan]
        expect: [{path: models/financial_pmpm/final/financial_pmpm__pmpm_prep.sql, line: 68, end_line: 87}]
      - commit: 7a5660c0a9
        parent: f220574382
        title: "adding fallback steps, fixing bad terminology join"
        fix: cc3df24bfa
        fix_title: "fixing bad term join"
        bug: "the Medicare specialty code join casts both sides to numeric, but the codes are two-character strings that can be alphanumeric, so those rows fail the cast and drop out of the inner join"
        category: nullability_or_cast
        in_scope: true
        must_mention: [specialty_code, cast, numeric]
        expect: [{path: models/tuva_provider_attribution/intermediate/provider_attribution__provider_classification.sql, line: 30, end_line: 31}]
      - commit: 85f2183839
        parent: 3a6e4dfbbd
        title: "Update safe_cast to try_cast for duckdb (#645)"
        fix: 19f50c9109
        fix_title: "Fix portable office-based surgery HCPCS casting (#1403)"
        bug: "on duckdb and databricks the filter is try_cast('hcpcs_code' as integer), casting the string literal rather than the column, so it is always null and the model returns no rows"
        category: nullability_or_cast
        in_scope: true
        must_mention: [try_cast, hcpcs_code, literal]
        expect: [{path: models/claims_preprocessing/service_category/intermediate/service_category__office_based_surgery_professional.sql, line: 11}]
      - commit: ccf6a06f80
        parent: d6e77c8959
        title: "Performance improvements for `claims_preprocessing.member_months` (#1088)"
        fix: c20ba04d3f
        fix_title: "Revert \"Performance improvements for `claims_preprocessing.member_mon… (#1123)"
        bug: "the rewrite drops SELECT DISTINCT and swaps dense_rank for row_number, so overlapping eligibility spans produce duplicate member months, each with its own member_month_key"
        category: row_count_change
        in_scope: true
        must_mention: [distinct, row_number, member_month_key]
        expect: [{path: models/claims_preprocessing/claims_enrollment/claims_enrollment__member_months.sql, line: 31, end_line: 56}]
      - commit: ca51597d90
        parent: "1262028007"
        title: "Dqi mart join fix (#630)"
        fix: 25f491b3d4
        fix_title: "fixing divide by 0 issue (#648)"
        bug: "cost_per_day and thirty_day_equivalent_cost divide paid_amount by days_supply with no guard, so a zero days_supply fails the query or yields an invalid value"
        category: other
        in_scope: false
        must_mention: [days_supply, divide by zero]
        expect: [{path: models/data_quality/dqi/mart_review/final/mart_review__pharmacy.sql, line: 24, end_line: 27}]
      - commit: 19f041823d
        parent: e61e5589b6
        title: "Adding revenue codes to hospice IP"
        fix: 685c2e15a5
        fix_title: "Bug fix"
        bug: "the new revenue code filter references med.revenue_center_code but the medical claim table is aliased s in this model, so the column reference does not resolve"
        category: other
        in_scope: true
        must_mention: [alias, revenue_center_code]
        expect: [{path: models/claims_preprocessing/service_category/intermediate/service_category__inpatient_hospice_institutional.sql, line: 16}]
      - commit: 86d7356107
        parent: e7cab0a4d9
        title: "Referencing home health directly instead of bill type codes associated."
        fix: 685c2e15a5
        fix_title: "Bug fix"
        bug: "the NOT EXISTS subquery reads hhi.claim_id2, a column service_category__home_health_institutional does not have (it selects claim_id)"
        category: schema_contract
        in_scope: true
        must_mention: [claim_id2, service_category__home_health_institutional]
        expect: [{path: models/claims_preprocessing/service_category/intermediate/service_category__outpatient_hospice_institutional.sql, line: 20}]
      - commit: b9e6ef9358
        parent: 215f37fd2c
        title: "fixed bug in normalized eligibility (#317)"
        fix: bd220669c3
        fix_title: "Fix date normalization (#443)"
        bug: "patient_id_key concatenates data_source, payer, plan and the enrollment dates with ||, so a null in any part makes the whole join key null and those eligibility rows lose their normalized dates"
        category: nullability_or_cast
        in_scope: true
        must_mention: [patient_id_key, null, concatenat]
        expect:
          - {path: models/claims_preprocessing/normalized_input/staging/normalized_input__stg_eligibility.sql, line: 3}
          - {path: models/claims_preprocessing/normalized_input/intermediate/normalized_input__int_eligibility_dates_normalize.sql, line: 4}

