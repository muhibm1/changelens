[project]
name = "fathom"
version = "0.1.0"
description = "The context layer for AI agents on data platforms: column-level lineage, constraints-as-code, ownership and incident history, checked before a change lands."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "duckdb>=1.1",
  "sqlglot>=25",
  "typer>=0.12",
  "pyyaml>=6",
  "rich>=13",
  "pydantic>=2",
  "mcp>=2",
  # The budget guard and price list every Anthropic API call goes through (providers.py); standard library only.
  "langsmith-flywheel @ git+https://github.com/muhibm1/flywheel@2d45d8e81d446257b71254f6e057c5259b54cdba",
]

[project.optional-dependencies]
fixture = ["dbt-core>=1.8", "dbt-duckdb>=1.8"]
dev = ["pytest>=8", "ruff>=0.6"]
bench = []  # kept so `.[bench]` installs still work; the benchmark agent uses Fathom's provider
embed = ["sentence-transformers>=3"]
syntax = ["tree-sitter>=0.23", "tree-sitter-language-pack>=1.22"]

[project.scripts]
fathom = "fathom.cli:app"
pipelinebench = "pipelinebench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Flywheel is pinned to a commit on GitHub, not a package index.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fathom", "src/pipelinebench"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
